<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 185" role="img" aria-labelledby="title desc">
  <title id="title">CloudWatch metrics data flow</title>
  <desc id="desc">The CloudWatch agent on EC2 publishes memory and disk metrics to CloudWatch every 60 seconds. The dashboard queries metric history every 30 seconds and sends it to the browser over WebSocket.</desc>
  <defs>
    <marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0b9f66"/></marker>
    <marker id="purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#805ad5"/></marker>
    <marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#1675e8"/></marker>
  </defs>
  <rect x="10" y="10" width="1060" height="165" rx="16" fill="#fbfdff" stroke="#e3eaf3"/>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle">
    <rect x="34" y="48" width="205" height="81" rx="15" fill="#fff4e2" stroke="#f0dfba" stroke-width="1.5"/>
    <circle cx="68" cy="87" r="19" fill="#ffe7bb"/><path d="M58 84h20m-20 7h20m-13-14v21" fill="none" stroke="#ba821c" stroke-width="2"/>
    <text x="151" y="78" fill="#8c6115" font-size="15" font-weight="750">EC2 + CloudWatch agent</text><text x="151" y="101" fill="#9b7b40" font-size="12">memory + root disk</text><text x="151" y="118" fill="#9b7b40" font-size="11" font-weight="700">publish every 60 sec</text>

    <rect x="326" y="48" width="170" height="81" rx="15" fill="#e8f8f1" stroke="#ccebdc" stroke-width="1.5"/>
    <circle cx="361" cy="87" r="19" fill="#c9f0dd"/><path d="M350 90c0-7 8-8 11-2 4-7 13-4 13 2m-20 5h25" fill="none" stroke="#0b9f66" stroke-width="2"/>
    <text x="429" y="84" fill="#11734f" font-size="15" font-weight="750">CloudWatch</text><text x="429" y="105" fill="#5b9178" font-size="11">metric history</text>

    <rect x="584" y="48" width="210" height="81" rx="15" fill="#f0ebff" stroke="#d8ccfa" stroke-width="1.5"/>
    <circle cx="620" cy="87" r="19" fill="#ddd2fa"/><path d="M611 79h18v16h-18zm4 4h10m-10 4h7m-7 4h10" fill="none" stroke="#805ad5" stroke-width="2"/>
    <text x="704" y="81" fill="#57369f" font-size="15" font-weight="750">Dashboard API</text><text x="704" y="102" fill="#76629d" font-size="11">queries last 30 min</text><text x="704" y="119" fill="#76629d" font-size="11" font-weight="700">polls every 30 sec</text>

    <rect x="875" y="48" width="170" height="81" rx="15" fill="#eaf3ff" stroke="#cfe2f8" stroke-width="1.5"/>
    <circle cx="910" cy="87" r="19" fill="#d7eaff"/><rect x="901" y="78" width="18" height="16" rx="3" fill="none" stroke="#1675e8" stroke-width="2"/><path d="M905 84h10m-10 5h7" stroke="#1675e8" stroke-width="2" stroke-linecap="round"/>
    <text x="969" y="84" fill="#075dbd" font-size="15" font-weight="750">Browser</text><text x="969" y="105" fill="#5e7fa6" font-size="11">charts via WebSocket</text>
  </g>
  <path d="M239 88h81" stroke="#0b9f66" stroke-width="3" marker-end="url(#green)"/><text x="279" y="72" text-anchor="middle" fill="#16835b" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700">instance profile</text>
  <path d="M496 88h80" stroke="#805ad5" stroke-width="3" marker-end="url(#purple)"/><text x="536" y="72" text-anchor="middle" fill="#684ab3" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700">AWS metrics API</text>
  <path d="M794 88h76" stroke="#1675e8" stroke-width="3" marker-end="url(#blue)"/><text x="832" y="72" text-anchor="middle" fill="#1265c5" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700">WebSocket</text>
</svg>
